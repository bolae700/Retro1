<!DOCTYPE html>
<html>
<head>
    <title>RETRO.PAVLY</title>
    <style>
        :root {
            --green: #00FF00;
            --black: #000000;
        }

        body {
            background: var(--black);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Courier New', monospace;
        }

        .retro-machine {
            width: 300px;
            height: 430px;
            background: var(--black);
            border: 2px solid var(--green);
            padding: 10px;
            position: relative;
        }

        .command-display {
            height: 20px;
            border: 1px solid var(--green);
            margin-bottom: 5px;
            color: var(--green);
            font-size: 10px;
            padding: 2px;
            overflow: hidden;
            white-space: nowrap;
        }

        .playlist-container {
            height: 180px;
            border: 1px solid var(--green);
            margin-bottom: 5px;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .playlist-container::-webkit-scrollbar {
            width: 8px;
        }

        .playlist-container::-webkit-scrollbar-track {
            background: var(--black);
        }

        .playlist-container::-webkit-scrollbar-thumb {
            background: var(--green);
        }

        .playlist-item {
            color: var(--green);
            font-size: 11px;
            padding: 4px;
            cursor: pointer;
            border-bottom: 1px solid #002200;
            transition: all 0.2s;
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
        }

        .playlist-item:hover {
            background: #002200;
            transform: translateX(3px);
        }

        .player-display {
            height: 80px;
            border: 1px solid var(--green);
            margin-bottom: 5px;
            padding: 5px;
            position: relative;
        }

        #visualizer {
            position: absolute;
            bottom: 5px;
            left: 5px;
            width: calc(100% - 10px);
            height: 30px;
        }

        .track-info {
            color: var(--green);
            font-size: 12px;
            margin-bottom: 3px;
            text-shadow: 0 0 5px var(--green);
        }

        .time-display {
            color: var(--green);
            font-size: 10px;
            position: absolute;
            bottom: 5px;
            right: 5px;
        }

        .control-row {
            display: flex;
            gap: 5px;
            justify-content: space-between;
            margin-top: 10px;
        }

        .pixel-btn {
            width: 23%;
            height: 25px;
            background: var(--black);
            border: 1px solid var(--green);
            color: var(--green);
            font-size: 10px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .pixel-btn:hover {
            background: var(--green);
            color: var(--black);
            transform: scale(1.05);
        }

        .status-bar {
            position: absolute;
            bottom: 2px;
            left: 5px;
            color: var(--green);
            font-size: 9px;
        }

        .progress-container {
            height: 3px;
            background: #002200;
            margin-bottom: 5px;
            cursor: pointer;
        }

        .progress-bar {
            height: 100%;
            background: var(--green);
            width: 0%;
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>
    <div class="retro-machine">
        <div class="command-display" id="cmd">SYSTEM READY</div>
        
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="playlist-container">
            <div class="playlist-item" data-src="https://raw.githubusercontent.com/bolae700/Suno/main/Luna%20y%20Llama.mp3">1. Luna y Llama</div>
            <div class="playlist-item" data-src="https://raw.githubusercontent.com/bolae700/Suno/main/عيون%20حبيبي.mp3">2. عيون حبيبي</div>
            <div class="playlist-item" data-src="https://raw.githubusercontent.com/bolae700/Suno/main/Alma%20y%20Arena.mp3">3. Alma y Arena</div>
            <div class="playlist-item" data-src="https://raw.githubusercontent.com/bolae700/Suno/main/Ainsi%20Bas%20La%20Vida.mp3">4. Ainsi Bas La Vida</div>
            <div class="playlist-item" data-src="https://raw.githubusercontent.com/bolae700/Suno/main/مش%20راضية.mp3">5. مش راضية</div>
            <div class="playlist-item" data-src="https://raw.githubusercontent.com/bolae700/Suno/main/الله%20محبة.mp3">6. ياللي بديت الرحله</div>
            <div class="playlist-item" data-src="https://raw.githubusercontent.com/bolae700/Suno/main/Sana%20Şükürler%20Olsun.mp3">6. Sana Şükürler Olsun</div>
        </div>

        <div class="player-display">
            <div class="track-info" id="currentTrack">TRACK: ...</div>
            <canvas id="visualizer"></canvas>
            <div class="time-display" id="timeDisplay">00:00 / 00:00</div>
        </div>

        <div class="control-row">
            <button class="pixel-btn" onclick="skip(-10)">REW</button>
            <button class="pixel-btn" onclick="togglePlay()" id="playBtn">PLAY</button>
            <button class="pixel-btn" onclick="skip(10)">FF</button>
            <button class="pixel-btn" onclick="shuffle()">SHF</button>
        </div>

        <div class="control-row" style="margin-top:5px">
            <button class="pixel-btn" onclick="adjustVolume(-0.1)">VOL-</button>
            <button class="pixel-btn" onclick="toggleMute()" id="muteBtn">MUTE</button>
            <button class="pixel-btn" onclick="adjustVolume(0.1)">VOL+</button>
            <button class="pixel-btn" onclick="toggleLoop()" id="loopBtn">LOOP</button>
        </div>

        <div class="status-bar" id="status">[PAVLY SYSTEM v2.0]</div>
    </div>

    <script>
        const audio = new Audio();
        audio.crossOrigin = "anonymous";
        let currentTrack = 0;
        let isPlaying = false;
        let audioContext, analyser, source;
        const playlistItems = document.querySelectorAll('.playlist-item');
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        
        // تهيئة الفيزوالايزر
        canvas.width = 280;
        canvas.height = 30;
        
        function initAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                source = audioContext.createMediaElementSource(audio);
                source.connect(analyser);
                analyser.connect(audioContext.destination);
                analyser.fftSize = 64;
            }
        }

        function visualize() {
            if (!analyser) return;
            
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            requestAnimationFrame(visualize);
            
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = '#00FF00';
            ctx.lineWidth = 1;
            ctx.beginPath();
            
            const sliceWidth = canvas.width / bufferLength;
            let x = 0;
            
            for(let i = 0; i < bufferLength; i++) {
                const v = dataArray[i] / 128;
                const y = v * canvas.height/2;
                
                if(i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
                
                x += sliceWidth;
            }
            
            ctx.stroke();
        }

        function logCommand(msg) {
            document.getElementById('cmd').textContent = `> ${msg}`;
            setTimeout(() => document.getElementById('cmd').textContent = '', 2000);
        }

        function updateDisplay() {
            document.getElementById('currentTrack').textContent = 
                `TRACK: ${playlistItems[currentTrack].textContent.split(' - ')[1]}`;
            
            document.getElementById('timeDisplay').textContent = 
                `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
        }

        function formatTime(sec) {
            return isNaN(sec) ? '00:00' : 
                `${Math.floor(sec/60).toString().padStart(2,'0')}:${Math.floor(sec%60).toString().padStart(2,'0')}`;
        }

        function loadTrack(index) {
            currentTrack = index;
            audio.src = playlistItems[currentTrack].dataset.src;
            playlistItems.forEach(item => item.style.background = 'transparent');
            playlistItems[currentTrack].style.background = '#002200';
            logCommand(`LOADING TRACK ${currentTrack + 1}`);
            
            audio.play().then(() => {
                isPlaying = true;
                document.getElementById('playBtn').textContent = 'PAUSE';
                if (!audioContext) initAudioContext();
                visualize();
            }).catch(error => {
                console.error('Error playing audio:', error);
                logCommand('PLAYBACK ERROR');
            });
        }

        function togglePlay() {
            if(audio.paused) {
                audio.play();
                if (!audioContext) initAudioContext();
                logCommand('PLAY');
            } else {
                audio.pause();
                logCommand('PAUSE');
            }
        }

        function skip(sec) {
            audio.currentTime += sec;
            logCommand(`SKIP ${sec > 0 ? '+' : ''}${sec}S`);
        }

        function shuffle() {
            const shuffled = [...playlistItems].sort(() => Math.random() - 0.5);
            document.querySelector('.playlist-container').innerHTML = '';
            shuffled.forEach(item => document.querySelector('.playlist-container').appendChild(item));
            logCommand('SHUFFLE ACTIVATED');
        }

        function adjustVolume(step) {
            audio.volume = Math.min(1, Math.max(0, audio.volume + step));
            logCommand(`VOL ${Math.round(audio.volume*100)}%`);
        }

        function toggleMute() {
            audio.muted = !audio.muted;
            document.getElementById('muteBtn').textContent = audio.muted ? 'UNMUTE' : 'MUTE';
            logCommand(audio.muted ? 'MUTE ON' : 'MUTE OFF');
        }

        function toggleLoop() {
            audio.loop = !audio.loop;
            document.getElementById('loopBtn').style.background = audio.loop ? '#002200' : 'transparent';
            logCommand(`LOOP ${audio.loop ? 'ON' : 'OFF'}`);
        }

        // Event Listeners
        audio.addEventListener('timeupdate', () => {
            const progress = (audio.currentTime / audio.duration) * 100 || 0;
            document.getElementById('progressBar').style.width = `${progress}%`;
            updateDisplay();
        });

        document.querySelector('.progress-container').addEventListener('click', (e) => {
            const rect = e.target.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            audio.currentTime = pos * audio.duration;
        });

        audio.addEventListener('play', () => {
            document.getElementById('playBtn').textContent = 'PAUSE';
            document.getElementById('status').textContent = '[PLAYING]';
        });

        audio.addEventListener('pause', () => {
            document.getElementById('playBtn').textContent = 'PLAY';
            document.getElementById('status').textContent = '[PAUSED]';
        });

        audio.addEventListener('ended', () => {
            if(!audio.loop) {
                currentTrack = (currentTrack + 1) % playlistItems.length;
                loadTrack(currentTrack);
            }
        });

        playlistItems.forEach((item, index) => {
            item.addEventListener('click', () => loadTrack(index));
        });

        // Initialize first track
        document.addEventListener('click', () => {
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }
        });
        loadTrack(0);
        audio.volume = 0.8;
    </script>
</body>
</html>
